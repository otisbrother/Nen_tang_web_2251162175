<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Form Validation Demo</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
  <style>
    label.error {
      color: red;
    }
  </style>
</head>
<body class="container mt-5">
  <h2 class="mb-4">Danh sách người dùng</h2>

  <!-- Nút bật form -->
  <button class="btn btn-primary" data-bs-toggle="modal" data-bs-target="#formModal">Thêm người dùng</button>

  <!-- Modal -->
  <div class="modal fade" id="formModal" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog">
      <form id="demoForm" class="modal-content">
        <div class="modal-header">
          <h5 class="modal-title">Thêm người dùng</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
        </div>
        <div class="modal-body">
          <div class="mb-3">
            <label>Email:</label>
            <input name="user" type="text" class="form-control"/>
          </div>
          <div class="mb-3">
            <label>Password:</label>
            <input id="password" name="password" type="password" class="form-control"/>
          </div>
          <div class="mb-3">
            <label>Re-Password:</label>
            <input id="re-password" name="re-password" type="password" class="form-control"/>
          </div>
          <div class="mb-3">
            <label>Số điện thoại:</label>
            <input name="phone" type="text" class="form-control"/>
          </div>
        </div>
        <div class="modal-footer">
          <button type="submit" class="btn btn-success">Đăng ký</button>
        </div>
      </form>
    </div>
  </div>

  <!-- Thêm script -->
  <script src="https://ajax.aspnetcdn.com/ajax/jQuery/jquery-3.6.0.min.js"></script>
  <script src="https://cdn.jsdelivr.net/jquery.validation/1.16.0/jquery.validate.min.js"></script>
  <script src="demoValidation.js"></script>
  <script src="data.js"></script>
</body>
</html>
