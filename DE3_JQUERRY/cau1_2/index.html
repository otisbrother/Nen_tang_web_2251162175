<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <title>Đề 3 - Quản lý người dùng</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet" />
  <script src="https://code.jquery.com/jquery-3.7.0.min.js"></script>
</head>
<body class="container mt-5">

  <h2 class="mb-4">Danh sách người dùng</h2>

  <!-- Nút mở form -->
  <button class="btn btn-primary mb-3" data-bs-toggle="modal" data-bs-target="#userModal">Thêm người dùng</button>

  <!-- Bảng hiển thị -->
  <table class="table table-bordered" id="userTable">
    <thead>
      <tr>
        <th>STT</th>
        <th>Họ</th>
        <th>Tên</th>
        <th>Địa chỉ</th>
      </tr>
    </thead>
    <tbody></tbody>
  </table>

  <!-- Modal Form -->
  <div class="modal fade" id="userModal" tabindex="-1">
    <div class="modal-dialog">
      <div class="modal-content">
        <form id="userForm">
          <div class="modal-header">
            <h5 class="modal-title">Thêm người dùng</h5>
            <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
          </div>
          <div class="modal-body">
            <input type="text" id="ho" class="form-control mb-2" placeholder="Họ" />
            <div id="errHo" class="text-danger small mb-2"></div>
            <input type="text" id="ten" class="form-control mb-2" placeholder="Tên" />
            <div id="errTen" class="text-danger small mb-2"></div>
            <input type="text" id="diachi" class="form-control mb-2" placeholder="Địa chỉ" />
            <div id="errDiachi" class="text-danger small"></div>
          </div>
          <div class="modal-footer">
            <button type="submit" class="btn btn-success">Lưu</button>
            <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Đóng</button>
          </div>
        </form>
      </div>
    </div>
  </div>

  <!-- Bootstrap JS -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
  <!-- jQuery -->
  <script src="data.js"></script>
  <script src="script.js"></script>
</body>
</html>
