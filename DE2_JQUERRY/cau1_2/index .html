<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <title>Đề 2 - Quản lý dữ liệu khách hàng</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    label.error {
      color: red;
    }
  </style>
</head>
<body class="container mt-4">
  <h2 class="mb-4">Danh sách dữ liệu</h2>
  <button class="btn btn-primary" data-bs-toggle="modal" data-bs-target="#formModal">Thêm mới</button>

  <!-- Modal Form -->
  <div class="modal fade" id="formModal" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog">
      <form id="dataForm" class="modal-content">
        <div class="modal-header">
          <h5 class="modal-title">Thêm dữ liệu</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
        </div>
        <div class="modal-body">
          <div class="mb-2">
            <label>Khách hàng:</label>
            <input type="text" name="customer" class="form-control"/>
          </div>
          <div class="mb-2">
            <label>Nhân viên:</label>
            <input type="text" name="employee" class="form-control"/>
          </div>
        </div>
        <div class="modal-footer">
          <button type="submit" class="btn btn-success">Lưu</button>
        </div>
      </form>
    </div>
  </div>

  <!-- Scripts -->
  <script src="https://ajax.aspnetcdn.com/ajax/jQuery/jquery-3.6.0.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/jquery-validation@1.19.5/dist/jquery.validate.min.js"></script>
  <script src="data.js"></script>
  <script src="validate.js"></script>
</body>
</html>
